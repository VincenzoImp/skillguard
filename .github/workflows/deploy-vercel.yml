name: Deploy Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: vercel-production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check Vercel secrets
        id: vercel-secrets
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Vercel deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID repository secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.vercel-secrets.outputs.configured == 'true'
        uses: actions/checkout@v6

      - name: Setup Node
        if: steps.vercel-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 22

      - name: Install root dependencies
        if: steps.vercel-secrets.outputs.configured == 'true'
        run: npm ci

      - name: Pull Vercel environment
        if: steps.vercel-secrets.outputs.configured == 'true'
        run: npx vercel@53.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        if: steps.vercel-secrets.outputs.configured == 'true'
        run: npx vercel@53.2.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Vercel production
        if: steps.vercel-secrets.outputs.configured == 'true'
        run: npx vercel@53.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Smoke production health
        if: steps.vercel-secrets.outputs.configured == 'true'
        run: curl --fail --show-error --silent --retry 5 --retry-all-errors https://skillguard-xi.vercel.app/api/health
