[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
skillguard = "HScpxWTMba1w73S4Qc7RZLm8nTj1SnRNBiANWbgaNNam"

[programs.devnet]
skillguard = "HScpxWTMba1w73S4Qc7RZLm8nTj1SnRNBiANWbgaNNam"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[test]
startup_wait = 10000

[test.validator]
bind_address = "127.0.0.1"
rpc_port = 8898
faucet_port = 9902
gossip_port = 8010
